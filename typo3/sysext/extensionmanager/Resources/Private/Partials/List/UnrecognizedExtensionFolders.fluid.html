<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:if condition="{unrecognizedExtensionFolders}">
    <f:be.infobox title="{f:translate(key: 'unrecognizedExtensionFolder.title')}" state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
        <p><f:translate key="unrecognizedExtensionFolder.message" arguments="{0: extensionsPath}" /></p>
        <ul>
            <f:for each="{unrecognizedExtensionFolders}" as="labelKey" key="folderName">
                <li><strong>{folderName}</strong>: <f:translate key="{labelKey}" /></li>
            </f:for>
        </ul>
        <p><a href="{unrecognizedExtensionFoldersDocumentationLink}" target="_blank" rel="noreferrer"><f:translate key="unrecognizedExtensionFolder.documentation" /></a></p>
    </f:be.infobox>
</f:if>
</html>
