<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="diff">
    <f:for each="{differences}" as="differencesItem" key="key">
        <div class="diff-item">
            <div class="diff-item-title">
                {differencesItem.title}
            </div>
            <div class="diff-item-result"><f:spaceless>
                <f:format.raw>{differencesItem.result}</f:format.raw>
            </f:spaceless></div>
            <f:if condition="{differences -> f:count()} > 1">
                <div class="diff-item-button col-control nowrap">
                    <f:if condition="{differencesItem.rollbackFields}">
                        <div class="btn-group">
                            <button
                                type="submit"
                                form="record-history-rollback"
                                name="rollbackFields"
                                value="{differencesItem.rollbackFields}"
                                class="btn btn-default t3js-modal-trigger"
                                data-severity="warning"
                                data-title="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_show_rechis.xlf:revertField')}"
                                data-content="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_show_rechis.xlf:rollback.confirm')}"
                                data-button-close-text="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel')}"
                                data-button-ok-text="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_show_rechis.xlf:rollback.confirm.button')}"
                            >
                                <core:icon identifier="actions-edit-undo" />
                                {f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_show_rechis.xlf:revertField')}
                            </button>
                        </div>
                    </f:if>
                </div>
            </f:if>
        </div>
    </f:for>
</div>
</html>
