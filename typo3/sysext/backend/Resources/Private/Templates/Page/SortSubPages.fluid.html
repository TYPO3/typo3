<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">

    <f:asset.module identifier="@typo3/backend/context-menu.js"/>
    <f:asset.module identifier="@typo3/backend/modal.js"/>

    <h1>
        <f:translate key="title" domain="backend.pages_sort" />
    </h1>

    <f:if condition="{isInWorkspace}">
        <f:then>
            <f:be.infobox
                title="{f:translate(key:'notAvailableInWorkspace.title', domain:'backend.pages_sort')}"
                message="{f:translate(key:'notAvailableInWorkspace.message', domain:'backend.pages_sort')}"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            />
        </f:then>
        <f:else>
            <f:if condition="{subPages}">
                <f:then>
                    <f:if condition="{hasInvisiblePage}">
                        <f:be.infobox
                            title="{f:translate(key:'hasInvisiblePage.title', domain:'backend.pages_sort')}"
                            message="{f:translate(key:'hasInvisiblePage.message', domain:'backend.pages_sort')}"
                            state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                        />
                    </f:if>

                    <h2>
                        <f:translate key="currentPageOrder" domain="backend.pages_sort" />
                    </h2>

                    <div class="table-fit">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>
                                        <f:translate key="fieldTitle" domain="backend.pages_sort" />
                                    </th>
                                    <th>
                                        <f:translate key="fieldSubtitle" domain="backend.pages_sort" />
                                    </th>
                                    <th>
                                        <f:translate key="fieldNavTitle" domain="backend.pages_sort" />
                                    </th>
                                    <th>
                                        <f:translate key="fieldTstamp" domain="backend.pages_sort" />
                                    </th>
                                    <th>
                                        <f:translate key="fieldCrdate" domain="backend.pages_sort" />
                                    </th>
                                </tr>
                            </thead>

                            <f:for each="{subPages}" as="page">
                                <tr>
                                    <td class="text-nowrap">
                                        <core:iconForRecord table="pages" row="{page.record}" />
                                        <f:if condition="!{page.canEdit}">
                                            <span title="{f:translate(key:'noEditPermissions', domain:'backend.pages_sort')}">
                                                <core:icon identifier="status-status-permission-denied" />
                                            </span>
                                        </f:if>
                                        {page.record.title -> f:format.crop(maxCharacters: maxTitleLength)}
                                    </td>
                                    <td class="text-nowrap">
                                        {page.record.subtitle -> f:format.crop(maxCharacters: maxTitleLength)}
                                    </td>
                                    <td class="text-nowrap">
                                        {page.record.nav_title -> f:format.crop(maxCharacters: maxTitleLength)}
                                    </td>
                                    <td class="text-nowrap">
                                        <f:format.date format="{dateFormat} {timeFormat}">{page.record.tstamp}</f:format.date>
                                    </td>
                                    <td class="text-nowrap">
                                        <f:format.date format="{dateFormat} {timeFormat}">{page.record.crdate}</f:format.date>
                                    </td>
                                </tr>
                            </f:for>
                        </table>
                    </div>

                    <h2>
                        <f:translate key="changeOrder" domain="backend.pages_sort" />
                    </h2>
                    <a class="btn btn-default t3js-modal-trigger"
                        href="{be:moduleLink(route:'pages_sort', arguments:'{id:parentPageUid, newSortBy:\'title\'}')}"
                        data-severity="warning"
                        data-title="{f:translate(key: 'sort_by_title.title', domain:'backend.pages_sort')}"
                        data-content="{f:translate(key: 'sort_by_title.description', domain:'backend.pages_sort')}"
                        data-button-close-text="{f:translate(key: 'cancel', domain:'core.action')}"
                        data-button-ok-text="{f:translate(key: 'sort', domain:'backend.pages_sort')}"
                    >
                        <f:translate key="changeOrderByTitle" domain="backend.pages_sort" />
                    </a>
                    <a class="btn btn-default t3js-modal-trigger"
                        href="{be:moduleLink(route:'pages_sort', arguments:'{id:parentPageUid, newSortBy:\'subtitle\'}')}"
                        data-severity="warning"
                        data-title="{f:translate(key: 'sort_by_subtitle.title', domain:'backend.pages_sort')}"
                        data-content="{f:translate(key: 'sort_by_subtitle.description', domain:'backend.pages_sort')}"
                        data-button-close-text="{f:translate(key: 'cancel', domain:'core.action')}"
                        data-button-ok-text="{f:translate(key: 'sort', domain:'backend.pages_sort')}"
                    >
                        <f:translate key="changeOrderBySubtitle" domain="backend.pages_sort" />
                    </a>
                    <a class="btn btn-default t3js-modal-trigger"
                        href="{be:moduleLink(route:'pages_sort', arguments:'{id:parentPageUid, newSortBy:\'nav_title\'}')}"
                        data-severity="warning"
                        data-title="{f:translate(key: 'sort_by_navigation_title.title', domain:'backend.pages_sort')}"
                        data-content="{f:translate(key: 'sort_by_navigation_title.description', domain:'backend.pages_sort')}"
                        data-button-close-text="{f:translate(key: 'cancel', domain:'core.action')}"
                        data-button-ok-text="{f:translate(key: 'sort', domain:'backend.pages_sort')}"
                    >
                        <f:translate key="changeOrderByNavtitle" domain="backend.pages_sort" />
                    </a>
                    <a class="btn btn-default t3js-modal-trigger"
                        href="{be:moduleLink(route:'pages_sort', arguments:'{id:parentPageUid, newSortBy:\'tstamp\'}')}"
                        data-severity="warning"
                        data-title="{f:translate(key: 'sort_by_change-time.title', domain:'backend.pages_sort')}"
                        data-content="{f:translate(key: 'sort_by_change-time.description', domain:'backend.pages_sort')}"
                        data-button-close-text="{f:translate(key: 'cancel', domain:'core.action')}"
                        data-button-ok-text="{f:translate(key: 'sort', domain:'backend.pages_sort')}"
                    >
                        <f:translate key="changeOrderByTstamp" domain="backend.pages_sort" />
                    </a>
                    <a class="btn btn-default t3js-modal-trigger"
                        href="{be:moduleLink(route:'pages_sort', arguments:'{id:parentPageUid, newSortBy:\'create\'}')}"
                        data-severity="warning"
                        data-title="{f:translate(key: 'sort_by_create-time.title', domain:'backend.pages_sort')}"
                        data-content="{f:translate(key: 'sort_by_create-time.description', domain:'backend.pages_sort')}"
                        data-button-close-text="{f:translate(key: 'cancel', domain:'core.action')}"
                        data-button-ok-text="{f:translate(key: 'sort', domain:'backend.pages_sort')}"
                    >
                        <f:translate key="changeOrderByCreate" domain="backend.pages_sort" />
                    </a>
                    <a class="btn btn-default t3js-modal-trigger"
                        href="{be:moduleLink(route:'pages_sort', arguments:'{id:parentPageUid, newSortBy:\'reverseCurrentSorting\'}')}"
                        data-severity="warning"
                        data-title="{f:translate(key: 'sort_by_reverse_order.title', domain:'backend.pages_sort')}"
                        data-content="{f:translate(key: 'sort_by_reverse_order.description', domain:'backend.pages_sort')}"
                        data-button-close-text="{f:translate(key: 'cancel', domain:'core.action')}"
                        data-button-ok-text="{f:translate(key: 'sort', domain:'backend.pages_sort')}"
                    >
                        <f:translate key="changeOrderReverse" domain="backend.pages_sort" />
                    </a>
                </f:then>
                <f:else>
                    <f:be.infobox
                        title="{f:translate(key:'noSubpages.title', domain:'backend.pages_sort')}"
                        message="{f:translate(key:'noSubpages.message', domain:'backend.pages_sort')}"
                        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
                    />
                </f:else>
            </f:if>
        </f:else>
    </f:if>

</f:section>

</html>
