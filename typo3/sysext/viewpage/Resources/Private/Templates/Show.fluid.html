<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">

    <f:asset.module identifier="@typo3/backend/element/qrcode-modal-button.js"/>
    <f:asset.module identifier="@typo3/viewpage/main.js"/>

    <div class="viewpage-item">
        <div class="viewpage-topbar t3js-viewpage-topbar">
            <div class="viewpage-topbar-orientation t3js-viewpage-topbar-orientation">
                <button type="button" class="btn btn-link t3js-change-orientation">
                    <core:icon identifier="actions-device-orientation-change" size="small" />
                    <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:rotateScreen')}</span>
                </button>
            </div>
            <div class="viewpage-topbar-preset">
                <div class="dropdown">
                    <button
                        type="button"
                        id="viewpage-topbar-preset-button"
                        class="btn btn-link dropdown-toggle"
                        data-bs-toggle="dropdown"
                    >
                        <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:selectScreenResolution')}:</span>
                        <span class="t3js-viewpage-current-label">{current.label}</span>
                    </button>
                    <ul class="dropdown-menu" role="menu" aria-label="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:selectScreenResolution')}">
                        <li role="presentation">
                            <button type="button" role="menuitem" class="dropdown-item t3js-preset-maximized t3js-change-preset" data-key="maximized" data-label="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:maximized')}" data-width data-height>
                                <span class="dropdown-item-columns">
                                    <span class="dropdown-item-column dropdown-item-column-icon" aria-hidden="true">
                                        <core:icon identifier="actions-fullscreen" size="small" />
                                    </span>
                                    <span class="dropdown-item-column dropdown-item-column-title">
                                        {f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:maximized')}
                                    </span>
                                    <span class="dropdown-item-column dropdown-item-column-nowrap dropdown-item-column-value">
                                        <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:width')}</span>
                                        100%
                                        <span aria-hidden="true">/</span>
                                        <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:height')}</span>
                                        100%
                                    </span>
                                </span>
                            </button>
                        </li>
                        <li role="presentation">
                            <button type="button" role="menuitem" class="dropdown-item t3js-preset-custom t3js-change-preset" data-key="custom" data-label="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:custom')}" data-width="{custom.width}" data-height="{custom.height}">
                                <span class="dropdown-item-columns">
                                    <span class="dropdown-item-column dropdown-item-column-icon" aria-hidden="true">
                                        <core:icon identifier="actions-expand" size="small" />
                                    </span>
                                    <span class="dropdown-item-column dropdown-item-column-title t3js-preset-custom-label">
                                        {f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:custom')}
                                    </span>
                                    <span class="dropdown-item-column dropdown-item-column-nowrap dropdown-item-column-value">
                                        <span class="t3js-preset-custom-width">{custom.width}</span>px
                                        <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:width')}</span>
                                        <span aria-hidden="true">/</span>
                                        <span class="t3js-preset-custom-height">{custom.height}</span>px
                                        <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:height')}</span>
                                    </span>
                                </span>
                            </button>
                        </li>
                        <f:for each="{presetGroups}" as="presetGroup" iteration="presetGroupIteration">
                            <f:if condition="{presetGroup}">
                                <li role="presentation"><hr role="separator" class="dropdown-divider"></li>
                                <f:for each="{presetGroup}" as="preset">
                                    <li role="presentation">
                                        <button
                                            type="button"
                                            role="menuitem"
                                            class="dropdown-item t3js-change-preset"
                                            data-key="{preset.key}"
                                            data-label="{preset.label}"
                                            data-width="{preset.width}"
                                            data-height="{preset.height}"
                                        >
                                            <span class="dropdown-item-columns">
                                                <span class="dropdown-item-column dropdown-item-column-icon" aria-hidden="true">
                                                    <f:switch expression="{preset.type}">
                                                        <f:case value="desktop"><core:icon identifier="actions-device-desktop" size="small" /></f:case>
                                                        <f:case value="tablet"><core:icon identifier="actions-device-tablet" size="small" /></f:case>
                                                        <f:case value="mobile"><core:icon identifier="actions-device-mobile" size="small" /></f:case>
                                                        <f:defaultCase><core:icon identifier="actions-device-unidentified" size="small" /></f:defaultCase>
                                                    </f:switch>
                                                </span>
                                                <span class="dropdown-item-column dropdown-item-column-title">
                                                    {preset.label}
                                                </span>
                                                <span class="dropdown-item-column dropdown-item-column-nowrap dropdown-item-column-value">
                                                    {f:if(condition: preset.width, then: '{preset.width}px', else: '100%')}
                                                    <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:width')}</span>
                                                    <span aria-hidden="true">/</span>
                                                    {f:if(condition: preset.height, then: '{preset.height}px', else: '100%')}
                                                    <span class="visually-hidden">{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:height')}</span>
                                                </span>
                                            </span>
                                        </button>
                                    </li>
                                </f:for>
                            </f:if>
                        </f:for>
                    </ul>
                </div>
            </div>
            <div role="group" class="viewpage-topbar-size" aria-label="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:setCustomScreenResolution')}">
                <input class="t3js-viewpage-input-width" type="number" name="width" min="300" max="9999" step="1" value="{current.width}" aria-label="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:width')}">
                <span aria-hidden="true">x</span>
                <input class="t3js-viewpage-input-height" type="number" name="height" min="300" max="9999" step="1" value="{current.height}" aria-label="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:height')}">
            </div>
        </div>
        <div class="viewpage-resizeable t3js-viewpage-resizeable" style="width:{current.width}px;height:{current.height}px;">
            <iframe src="{url}" width="100%" height="100%" id="tx_viewpage_iframe" frameborder="0" border="0" title="{f:translate(key: 'LLL:EXT:viewpage/Resources/Private/Language/locallang.xlf:iframe.title')}"></iframe>
            <f:comment><!-- support handles for interactjs --></f:comment>
            <div class="resizable-w"></div>
            <div class="resizable-s"></div>
            <div class="resizable-e"></div>
        </div>
    </div>

</f:section>

</html>
