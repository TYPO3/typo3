services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  TYPO3\CMS\IndexedSearch\:
    resource: '../Classes/*'

  TYPO3\CMS\IndexedSearch\Domain\Repository\IndexSearchRepository:
    shared: false

  TYPO3\CMS\IndexedSearch\Indexer:
    shared: false

  TYPO3\CMS\IndexedSearch\Hook\RecordIndexingDataHandlerHook:
    public: true

  TYPO3\CMS\IndexedSearch\Hook\DeleteIndexedData:
    # Public: the class is called as a DataHandler hook, which is resolved through GeneralUtility::makeInstance().
    public: true
