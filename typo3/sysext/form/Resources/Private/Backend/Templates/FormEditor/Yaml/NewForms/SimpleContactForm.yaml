identifier: ext-form-simple-contact-form-example
label: 'Simple Contact Form'
type: Form

finishers:
  -
    identifier: EmailToReceiver
    options:
      subject: 'Contact form: {subject}'
      recipients:
        your.company.recipient@example.com: 'Your company name'
      senderAddress: 'your.company.sender@example.com'
      senderName: 'Your company name - contact form'
      replyToRecipients:
        '{email}': '{name}'
      carbonCopyRecipients: {}
      blindCarbonCopyRecipients: {}
      format: 'html'
      attachUploads: 'true'
      translation:
        language: ''
      title: 'New contact form request'

renderables:
  -
    identifier: page-1
    label: 'Contact Form'
    type: Page

    renderables:
      -
        defaultValue: ''
        identifier: name
        label: 'Name'
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: 'Name'
            autocomplete: name
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: subject
        label: 'Subject'
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: 'Subject'
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: 'Email'
        type: Email
        properties:
          fluidAdditionalAttributes:
            placeholder: 'Email address'
            autocomplete: email
            required: required
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
      -
        defaultValue: ''
        identifier: message
        label: 'Message'
        type: Textarea
        properties:
          fluidAdditionalAttributes:
            placeholder: ''
            required: required
        validators:
          -
            identifier: NotEmpty

  -
    identifier: summarypage
    label: 'Summary page'
    type: SummaryPage
