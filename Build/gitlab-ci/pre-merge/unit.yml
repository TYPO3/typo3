unit javascript pre-merge:
  stage: main
  tags:
    - metal2
  except:
    refs:
      - schedules
      - "14.3"
  cache:
    key: 14.3-js
    paths:
      - .cache
  script:
    - Build/Scripts/runTests.sh -s unitJavascript

unit php 8.2 random pre-merge:
  stage: main
  tags:
    - metal2
  except:
    refs:
      - schedules
      - "14.3"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - typo3temp/var/tests/junit-reports
    reports:
      junit: typo3temp/var/tests/junit-reports/unit-random.xml
  script:
    - Build/Scripts/runTests.sh -s composerInstall -p 8.2
    - Build/Scripts/runTests.sh -s unitRandom -p 8.2 -- --log-junit typo3temp/var/tests/junit-reports/unit-random.xml

