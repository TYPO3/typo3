unit javascript pre-merge:
  stage: main
  tags:
    - metal2
  except:
    refs:
      - schedules
      - main
  cache:
    key: main-js
    paths:
      - .cache
  script:
    - Build/Scripts/runTests.sh -s unitJavascript

unit php 8.5 random pre-merge:
  stage: main
  tags:
    - metal2
  except:
    refs:
      - schedules
      - main
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - typo3temp/var/tests/junit-reports
    reports:
      junit: typo3temp/var/tests/junit-reports/unit-random.xml
  script:
    - Build/Scripts/runTests.sh -s composerInstall -p 8.5
    - Build/Scripts/runTests.sh -s unitRandom -p 8.5 -- --log-junit typo3temp/var/tests/junit-reports/unit-random.xml

