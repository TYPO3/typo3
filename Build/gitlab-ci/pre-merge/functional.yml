functional mariadb 10.4 php 8.5 pdo_mysql pre-merge:
  stage: main
  tags:
    - metal2
  except:
    refs:
      - schedules
      - main
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - typo3temp/var/tests/junit-reports
    reports:
      junit: typo3temp/var/tests/junit-reports/functional-*.xml
  parallel: 6
  script:
    - Build/Scripts/runTests.sh -s composerInstall -p 8.5
    - Build/Scripts/runTests.sh -s functional -d mariadb -a pdo_mysql -i 10.4 -p 8.5 -c $CI_NODE_INDEX/$CI_NODE_TOTAL -- --log-junit typo3temp/var/tests/junit-reports/functional-$CI_NODE_INDEX.xml

