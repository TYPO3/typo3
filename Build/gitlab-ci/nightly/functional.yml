functional mariadb 11.8 php 8.5 max:
  stage: functional
  tags:
    - metal2
  needs: []
  only:
    - schedules
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - typo3temp/var/tests/junit-reports
    reports:
      junit: typo3temp/var/tests/junit-reports/functional-*.xml
  parallel: 6
  script:
    - Build/Scripts/runTests.sh -s composerInstallMax -p 8.5
    - Build/Scripts/runTests.sh -s functional -d mariadb -i 11.8 -p 8.5 -c $CI_NODE_INDEX/$CI_NODE_TOTAL -- --log-junit typo3temp/var/tests/junit-reports/functional-$CI_NODE_INDEX.xml
